<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КАРТА СЕТИ // NEVOBRAIT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap');

        :root {
            --bg: #050505;
            --red: #c23c35;
            --red-glow: rgba(194, 60, 53, 0.4);
            --text: #d2cfc1;
            --line: rgba(194, 60, 53, 0.2);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Сетка на фоне */
            background-image: 
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .map-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 600px;
        }

        /* Линии связей (SVG) */
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        line {
            stroke: var(--red);
            stroke-width: 2;
            stroke-dasharray: 5, 5;
            opacity: 0.3;
            animation: dash 20s linear infinite;
        }

        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }

        /* Узлы */
        .node {
            position: absolute;
            z-index: 10;
            transform: translate(-50%, -50%);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .node-circle {
            width: 60px;
            height: 60px;
            border: 2px solid var(--red);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(194, 60, 53, 0.1);
            box-shadow: 0 0 15px var(--red-glow);
            margin: 0 auto 10px auto;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .node:hover .node-circle {
            background: var(--red);
            color: #000;
            box-shadow: 0 0 30px var(--red);
            transform: scale(1.1);
        }

        .node-label {
            font-size: 0.9rem;
            color: var(--red);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px var(--red-glow);
            transition: all 0.3s ease;
        }

        .node:hover .node-label {
            color: #fff;
            text-shadow: 0 0 10px #fff;
        }

        /* Позиции узлов (Координаты в %) */
        #node-center { top: 50%; left: 50%; }
        #node-terminal { top: 20%; left: 20%; }
        #node-archive { top: 20%; left: 80%; }
        #node-forum { top: 80%; left: 20%; }
        #node-files { top: 80%; left: 80%; }
        #node-adkinator { top: 10%; left: 50%; }
        #node-404 { top: 90%; left: 50%; }

        /* Специальный стиль для центра */
        #node-center .node-circle {
            width: 100px;
            height: 100px;
            border-width: 3px;
            font-size: 1.2rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(194, 60, 53, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(194, 60, 53, 0); }
            100% { box-shadow: 0 0 0 0 rgba(194, 60, 53, 0); }
        }

        /* Заголовок */
        .header {
            position: absolute;
            top: -80px;
            left: 0;
            width: 100%;
            text-align: center;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--red);
            letter-spacing: 5px;
            font-size: 1.5rem;
            margin: 0;
            text-shadow: 0 0 10px var(--red-glow);
        }
        .header p {
            color: #555;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .map-container { height: 500px; }
            .node-circle { width: 40px; height: 40px; font-size: 0.6rem; }
            #node-center .node-circle { width: 70px; height: 70px; font-size: 0.8rem; }
            .node-label { font-size: 0.7rem; }
            .header h1 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="map-container">
        
        <div class="header">
            <h1>КАРТА СЕТИ NEVOBRAIT</h1>
            <p>Нажмите на узел для перехода</p>
        </div>

        <!-- SVG для линий -->
        <svg>
            <!-- Линии от центра к узлам -->
            <line x1="50%" y1="50%" x2="20%" y2="20%" />
            <line x1="50%" y1="50%" x2="80%" y2="20%" />
            <line x1="50%" y1="50%" x2="20%" y2="80%" />
            <line x1="50%" y1="50%" x2="80%" y2="80%" />
            <line x1="50%" y1="50%" x2="50%" y2="10%" />
            <line x1="50%" y1="50%" x2="50%" y2="90%" />
            
            <!-- Дополнительные связи (для вида) -->
            <line x1="20%" y1="20%" x2="50%" y2="10%" />
            <line x1="80%" y1="20%" x2="50%" y2="10%" />
            <line x1="20%" y1="80%" x2="50%" y2="90%" />
            <line x1="80%" y1="80%" x2="50%" y2="90%" />
        </svg>

        <!-- Узлы -->
        <!-- Центр -->
        <a href="index.html" class="node" id="node-center">
            <div class="node-circle">NV</div>
            <div class="node-label">ЯДРО</div>
        </a>

        <!-- Терминал -->
        <a href="index.html#terminal" class="node" id="node-terminal">
            <div class="node-circle">TR</div>
            <div class="node-label">ТЕРМИНАЛ</div>
        </a>

        <!-- Архив -->
        <a href="index.html#archive" class="node" id="node-archive">
            <div class="node-circle">AR</div>
            <div class="node-label">АРХИВ</div>
        </a>

        <!-- Форум -->
        <a href="index.html#forum" class="node" id="node-forum">
            <div class="node-circle">FR</div>
            <div class="node-label">ФОРУМ</div>
        </a>

        <!-- Файлы -->
        <a href="index.html" class="node" id="node-files">
            <div class="node-circle">FL</div>
            <div class="node-label">ФАЙЛЫ</div>
        </a>

        <!-- Адкинатор -->
        <a href="adkinator.html" class="node" id="node-adkinator">
            <div class="node-circle">AD</div>
            <div class="node-label">АДКИНАТОР</div>
        </a>

        <!-- 404 -->
        <a href="404.html" class="node" id="node-404">
            <div class="node-circle">40</div>
            <div class="node-label">ОШИБКА</div>
        </a>

    </div>

</body>
</html>
