<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — СБОЙ СИСТЕМЫ // NEVOBRAIT</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --bg: #0b0d0e;
            --red: #c23c35;
            --red-glow: rgba(194, 60, 53, 0.6);
            --text: #d2cfc1;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-direction: column;
            position: relative;
        }

        /* Матричный дождь */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }

        /* Эффект CRT-монитора + мерцание */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 10;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            100% { opacity: 1; }
        }

        /* Контент */
        .content {
            position: relative;
            z-index: 5;
            text-align: center;
            max-width: 800px;
            width: 90%;
            padding: 30px;
            border: 1px solid rgba(194, 60, 53, 0.3);
            background: rgba(11, 13, 14, 0.85);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(194, 60, 53, 0.1);
            backdrop-filter: blur(2px);
        }

        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-size: 8rem;
            font-weight: 900;
            color: var(--red);
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 10px var(--red), 0 0 30px var(--red-glow);
            animation: glitch 1s infinite alternate;
        }

        .error-msg {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text);
            margin: 20px 0;
            background: rgba(194, 60, 53, 0.1);
            padding: 10px;
            border-left: 2px solid var(--red);
            display: inline-block;
        }

        .system-log {
            text-align: left;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
            min-height: 90px; /* Чтобы текст не прыгал */
        }
        .system-log span { color: var(--red); font-weight: bold; }
        .cursor { display: inline-block; width: 8px; height: 14px; background: var(--red); animation: blink 1s step-end infinite; vertical-align: middle; margin-left: 5px;}
        @keyframes blink { 50% { opacity: 0; } }

        .btn {
            display: inline-block;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 15px 40px;
            border: 2px solid var(--red);
            background: rgba(194, 60, 53, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        
        /* Эффект сканирования на кнопке */
        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::after { left: 100%; }
        
        .btn:hover {
            background: var(--red);
            box-shadow: 0 0 20px var(--red);
            text-shadow: 0 0 5px #fff;
        }

        /* Анимация глитча */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 2px) }
            40% { transform: translate(-3px, -2px) }
            60% { transform: translate(3px, 2px) }
            80% { transform: translate(3px, -2px) }
            100% { transform: translate(0) }
        }
        
        @media (max-width: 600px) {
            .error-code { font-size: 5rem; }
            .content { padding: 20px 15px; }
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <div class="scanlines"></div>

    <div class="content">
        <h1 class="error-code">404</h1>
        
        <div class="error-msg">СЕКТОР НЕ НАЙДЕН. ДОСТУП ЗАПРЕЩЕН.</div>

        <div class="system-log" id="log">
            <!-- Тут будет печататься текст -->
        </div>

        <a href="https://nev0brait.github.io/" class="btn">ВЕРНУТЬСЯ В АРХИВ</a>
    </div>

    <script>
        // 1. Матричный дождь
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ0123456789'.split('');
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(11, 13, 14, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#c23c35';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 2. Эффект печатной машинки для лога
        const logElement = document.getElementById('log');
        const path = window.location.pathname;
        
        const logs = [
            `> ЗАПРОС К СЕКТОРУ: <span>${path}</span>`,
            `> СТАТУС: <span>ОТКАЗАНО</span>`,
            `> ПРИЧИНА: <span>ДАННЫЕ УНИЧТОЖЕНЫ ИЛИ ПОВРЕЖДЕНЫ</span>`,
            `> РЕКОМЕНДАЦИЯ: <span>НЕМЕДЛЕННО ПОКИНУТЬ УЗЕЛ</span>`
        ];

        let currentLine = 0;
        let currentChar = 0;

        function typeLog() {
            if (currentLine < logs.length) {
                const line = logs[currentLine];
                // Если это первый символ строки, создаем новый div
                if (currentChar === 0) {
                    logElement.innerHTML += `<div id="line-${currentLine}"></div>`;
                }
                
                const targetDiv = document.getElementById(`line-${currentLine}`);
                // Обрабатываем HTML теги (span) как единое целое
                // Простое решение: выводим строку посимвольно, но с задержкой
                // (Для простоты мы просто выведем всю строку с задержкой, так как парсить HTML посимвольно сложно)
                
                targetDiv.innerHTML = line;
                currentLine++;
                
                setTimeout(typeLog, 600); // Пауза между строками
            } else {
                // Добавляем мигающий курсор в конце
                logElement.innerHTML += '<span class="cursor"></span>';
            }
        }

        // Запускаем печать через секунду после загрузки
        setTimeout(typeLog, 500);
        
        // 3. Звук (попытка)
        // Так как браузеры блокируют звук без клика, мы просто добавим невидимую кнопку
        // или проиграем звук при первом клике на страницу.
        document.body.addEventListener('click', function playBeep() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime); // Низкий гул
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime); // Тихо
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
            
            document.body.removeEventListener('click', playBeep);
        });

    </script>
</body>
</html>
