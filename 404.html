<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — СБОЙ СИСТЕМЫ // NEVOBRAIT</title>
    <meta http-equiv="refresh" content="7;url=https://nev0brait.github.io/">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --bg: #0b0d0e;
            --red: #c23c35;
            --red-glow: rgba(194, 60, 53, 0.6);
            --text: #d2cfc1;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-direction: column;
            position: relative;
        }

        /* Матричный дождь (Canvas) */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }

        /* Эффект CRT-монитора */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* Контент */
        .content {
            position: relative;
            z-index: 5;
            text-align: center;
            max-width: 800px;
            padding: 20px;
            border: 1px solid rgba(194, 60, 53, 0.3);
            background: rgba(11, 13, 14, 0.8);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(194, 60, 53, 0.1);
            backdrop-filter: blur(2px);
        }

        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-size: 8rem;
            font-weight: 900;
            color: var(--red);
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 10px var(--red), 0 0 30px var(--red-glow);
            animation: glitch 1s infinite alternate;
        }

        .error-msg {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text);
            margin: 20px 0;
            background: rgba(194, 60, 53, 0.1);
            padding: 10px;
            border-left: 2px solid var(--red);
            display: inline-block;
        }

        .system-log {
            text-align: left;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .system-log span { color: var(--red); }

        .btn {
            display: inline-block;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 15px 40px;
            border: 2px solid var(--red);
            background: rgba(194, 60, 53, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            background: var(--red);
            box-shadow: 0 0 20px var(--red);
            text-shadow: 0 0 5px #fff;
        }

        .timer {
            font-size: 0.8rem;
            color: #666;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Анимация глитча */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 2px) }
            40% { transform: translate(-3px, -2px) }
            60% { transform: translate(3px, 2px) }
            80% { transform: translate(3px, -2px) }
            100% { transform: translate(0) }
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <div class="scanlines"></div>

    <div class="content">
        <h1 class="error-code">404</h1>
        
        <div class="error-msg">СЕКТОР НЕ НАЙДЕН. ДОСТУП ЗАПРЕЩЕН.</div>

        <div class="system-log">
            > ЗАПРОС К СЕКТОРУ: <span id="url-path"></span><br>
            > СТАТУС: <span>ОТКАЗАНО</span><br>
            > ПРИЧИНА: <span>ДАННЫЕ УНИЧТОЖЕНЫ ИЛИ ПОВРЕЖДЕНЫ</span><br>
            > РЕКОМЕНДАЦИЯ: <span>НЕМЕДЛЕННО ПОКИНУТЬ УЗЕЛ</span>
        </div>

        <a href="https://nev0brait.github.io/" class="btn">ВЕРНУТЬСЯ В АРХИВ</a>

        <div class="timer">АВТОМАТИЧЕСКАЯ ЭВАКУАЦИЯ ЧЕРЕЗ <span id="countdown">7</span> СЕКУНД...</div>
    </div>

    <script>
        // 1. Матричный дождь
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ0123456789'.split('');
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(11, 13, 14, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#c23c35';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 2. Вывод "битого" URL
        const path = window.location.pathname;
        document.getElementById('url-path').textContent = path;

        // 3. Таймер обратного отсчета
        let timeLeft = 7;
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            if (timeLeft <= 0) clearInterval(timer);
        }, 1000);
    </script>
</body>
</html>
